<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Luxury Emerald Gradient -->
    <radialGradient id="bgEmerald" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#103c2a" />
      <stop offset="55%" stop-color="#061811" />
      <stop offset="100%" stop-color="#020a07" />
    </radialGradient>

    <!-- 24K Gold Metallic Gradient -->
    <linearGradient id="gold24k" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="25%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#FFB300" />
      <stop offset="75%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Gold Light Highlight -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="35%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Electric Emerald Glow -->
    <linearGradient id="emeraldNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.8"/>
    </filter>

    <filter id="shadowSpade" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- 1. Squircle Backdrop -->
  <rect width="512" height="512" rx="112" fill="url(#bgEmerald)" />

  <!-- 2. Outer 24K Gold Rim & Casino Beaded Rim -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#gold24k)" stroke-width="4.5" opacity="0.9" />
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#gold24k)" stroke-width="3" stroke-dasharray="6, 8" opacity="0.5" />
  <circle cx="256" cy="256" r="208" fill="none" stroke="url(#emeraldNeon)" stroke-width="1.5" opacity="0.4" />

  <!-- 3. ♠ Majestic Ace of Spades (Centerpiece) -->
  <g filter="url(#shadowSpade)">
    <!-- Golden Spade Base -->
    <path d="M 256 105 C 300 155, 390 195, 390 250 C 390 315, 318 355, 270 335 C 262 330, 258 328, 256 328 C 254 328, 250 330, 242 335 C 194 355, 122 315, 122 250 C 122 195, 212 155, 256 105 Z" fill="url(#gold24k)" stroke="#78350F" stroke-width="3" />
    <!-- Spade Stem -->
    <path d="M 250 328 C 248 355, 220 385, 192 400 L 320 400 C 292 385, 264 355, 262 328 Z" fill="url(#gold24k)" stroke="#78350F" stroke-width="2" />

    <!-- Inner Emerald Velvet Spade Layer -->
    <path d="M 256 128 C 294 170, 370 205, 370 250 C 370 304, 308 338, 268 322 C 261 318, 257 316, 256 316 C 255 316, 251 318, 244 322 C 204 338, 142 304, 142 250 C 142 205, 218 170, 256 128 Z" fill="#061a12" stroke="url(#goldLight)" stroke-width="2.5" />
  </g>

  <!-- 4. Royal 5-Point Crown on Spade Top -->
  <g filter="url(#glowGold)">
    <path d="M 186 155 L 178 98 L 218 122 L 256 70 L 294 122 L 334 98 L 326 155 Z" fill="url(#goldLight)" stroke="#B45309" stroke-width="2.5" />
    <rect x="184" y="152" width="144" height="14" rx="4" fill="url(#gold24k)" stroke="#B45309" stroke-width="1.5" />
    <!-- Jewels -->
    <circle cx="256" cy="70" r="7.5" fill="#00E676" stroke="#FFF" stroke-width="1.5" />
    <circle cx="178" cy="98" r="5" fill="#FFE57F" />
    <circle cx="334" cy="98" r="5" fill="#FFE57F" />
    <circle cx="218" cy="122" r="4.5" fill="#00E676" />
    <circle cx="294" cy="122" r="4.5" fill="#00E676" />
    <circle cx="256" cy="159" r="3.5" fill="#00E676" />
  </g>

  <!-- 5. Lucky 3D "777" Inside the Spade -->
  <g filter="url(#glowGold)">
    <!-- Left 7 -->
    <text x="194" y="278" font-family="'Impact', 'Arial Black', sans-serif" font-size="95" font-weight="900" fill="url(#goldLight)" stroke="#78350F" stroke-width="2.5" text-anchor="middle">7</text>
    <!-- Right 7 -->
    <text x="318" y="278" font-family="'Impact', 'Arial Black', sans-serif" font-size="95" font-weight="900" fill="url(#goldLight)" stroke="#78350F" stroke-width="2.5" text-anchor="middle">7</text>
    <!-- Center 7 (Prominent) -->
    <text x="256" y="284" font-family="'Impact', 'Arial Black', sans-serif" font-size="118" font-weight="900" fill="url(#gold24k)" stroke="#451A03" stroke-width="4" text-anchor="middle">7</text>
  </g>

  <!-- 6. Sparkle Diamond Stars (✦) -->
  <g fill="#FFE57F">
    <path d="M 145 195 Q 145 206 135 206 Q 145 206 145 217 Q 145 206 155 206 Q 145 206 145 195 Z" />
    <path d="M 367 195 Q 367 206 357 206 Q 367 206 367 217 Q 367 206 377 206 Q 367 206 367 195 Z" />
  </g>

  <!-- 7. Bottom Gold Banner: PLAYON777 -->
  <g filter="url(#shadowSpade)">
    <path d="M 100 420 L 130 395 L 382 395 L 412 420 L 390 455 L 122 455 Z" fill="#072016" stroke="url(#gold24k)" stroke-width="3" />
    <text x="256" y="437" font-family="'Arial Black', 'Impact', sans-serif" font-size="28" font-weight="900" letter-spacing="8" fill="url(#goldLight)" text-anchor="middle">PLAYON777</text>
  </g>
</svg>
