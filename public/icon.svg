<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Luxury Emerald Gradient -->
    <radialGradient id="bgEmerald" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#0f3d2a" />
      <stop offset="55%" stop-color="#061811" />
      <stop offset="100%" stop-color="#020a07" />
    </radialGradient>

    <!-- 24K Gold Metallic Gradient -->
    <linearGradient id="gold24k" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="25%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#FFB300" />
      <stop offset="75%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Gold Highlight Gradient for Crown/Bevel -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="35%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Electric Emerald Glow -->
    <linearGradient id="emeraldNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.7"/>
    </filter>

    <filter id="shadowHeavy" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 1. Base Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgEmerald)" />

  <!-- 2. Outer 24K Gold Rim -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#gold24k)" stroke-width="4.5" opacity="0.9" />
  
  <!-- 3. Casino Coin Beaded Outer Ring -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#gold24k)" stroke-width="3" stroke-dasharray="6, 8" opacity="0.5" />
  <circle cx="256" cy="256" r="208" fill="none" stroke="url(#emeraldNeon)" stroke-width="1.5" opacity="0.4" />

  <!-- 4. Central Shield Base -->
  <g filter="url(#shadowHeavy)">
    <path d="M 256 75 L 390 115 L 390 230 L 340 335 L 256 385 L 172 335 L 122 230 L 122 115 Z" fill="#072016" stroke="url(#gold24k)" stroke-width="5" />
    <path d="M 256 88 L 376 123 L 376 222 L 330 318 L 256 365 L 182 318 L 136 222 L 136 123 Z" fill="none" stroke="url(#gold24k)" stroke-width="1.5" opacity="0.4" />
  </g>

  <!-- 5. Royal 5-Point Crown -->
  <g filter="url(#glowGold)">
    <path d="M 186 175 L 180 122 L 218 145 L 256 95 L 294 145 L 332 122 L 326 175 Z" fill="url(#goldLight)" stroke="#B45309" stroke-width="2.5" />
    <rect x="184" y="172" width="144" height="14" rx="4" fill="url(#gold24k)" stroke="#B45309" stroke-width="1.5" />
    <!-- Crown Jewels -->
    <circle cx="256" cy="95" r="7" fill="#00E676" stroke="#FFF" stroke-width="1.5" />
    <circle cx="180" cy="122" r="5" fill="#FFE57F" />
    <circle cx="332" cy="122" r="5" fill="#FFE57F" />
    <circle cx="218" cy="145" r="4.5" fill="#00E676" />
    <circle cx="294" cy="145" r="4.5" fill="#00E676" />
    <circle cx="256" cy="179" r="3.5" fill="#00E676" />
  </g>

  <!-- 6. Lucky 3D "777" -->
  <g filter="url(#glowGold)">
    <!-- Left 7 -->
    <text x="178" y="300" font-family="'Impact', 'Arial Black', sans-serif" font-size="112" font-weight="900" fill="url(#goldLight)" stroke="#78350F" stroke-width="3" text-anchor="middle">7</text>
    <!-- Right 7 -->
    <text x="334" y="300" font-family="'Impact', 'Arial Black', sans-serif" font-size="112" font-weight="900" fill="url(#goldLight)" stroke="#78350F" stroke-width="3" text-anchor="middle">7</text>
    <!-- Center 7 (Prominent) -->
    <text x="256" y="306" font-family="'Impact', 'Arial Black', sans-serif" font-size="136" font-weight="900" fill="url(#gold24k)" stroke="#451A03" stroke-width="4.5" text-anchor="middle">7</text>
  </g>

  <!-- 7. Sparkle Stars (✦) -->
  <g fill="#FFE57F">
    <path d="M 152 205 Q 152 216 142 216 Q 152 216 152 227 Q 152 216 162 216 Q 152 216 152 205 Z" />
    <path d="M 360 205 Q 360 216 350 216 Q 360 216 360 227 Q 360 216 370 216 Q 360 216 360 205 Z" />
  </g>

  <!-- 8. Bottom Gold Banner: PLAYON -->
  <g filter="url(#shadowHeavy)">
    <path d="M 120 405 L 145 385 L 367 385 L 392 405 L 372 442 L 140 442 Z" fill="#0a1f16" stroke="url(#gold24k)" stroke-width="3.5" />
    <text x="256" y="423" font-family="'Arial Black', 'Impact', sans-serif" font-size="30" font-weight="900" letter-spacing="9" fill="url(#goldLight)" text-anchor="middle">PLAYON</text>
  </g>
</svg>
